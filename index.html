<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TILATA Bluetooth Төлөм Пульту</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; background-color: #1e293b; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #38bdf8; font-size: 22px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 25px; }
        .status-box { background-color: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; color: #e2e8f0; }
        .status-connected { color: #4ade80; border-color: #4ade80; }
        .status-error { color: #f87171; border-color: #f87171; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-connect { background-color: #3b82f6; color: white; }
        .btn-disconnect { background-color: #ef4444; color: white; }
        .btn-pay { background-color: #22c55e; color: white; font-size: 18px; padding: 20px; }
        .btn-pay:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; }
        .settings { margin-top: 30px; border-top: 1px solid #334155; padding-top: 20px; }
        label { font-size: 14px; color: #cbd5e1; display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; background-color: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; margin-bottom: 10px; }
        .btn-save { background-color: #64748b; color: white; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>TILATA PAYMENT</h1>
    <p class="subtitle">Bluetooth аркылуу башкаруу пульту</p>

    <div id="status-box" class="status-box">Статус: Туташкан жок</div>

    <button id="btn-connect" class="btn-connect" onclick="connectBluetooth()">🔗 Bluetooth аркылуу туташуу</button>
    <button id="btn-disconnect" class="btn-disconnect" onclick="disconnectBluetooth()" style="display: none;">❌ Ажыратуу</button>

    <button id="btn-pay" class="btn-pay" onclick="sendPaymentSignal()" disabled>💵 500 сом төлөндү (Тест)</button>

    <div class="settings">
        <label>Колонканын (ESP32) Bluetooth аты:</label>
        <input type="text" id="device-name" value="TILATA_COLONKA">
        <button class="btn-save" onclick="saveSettings()">Сактоо</button>
    </div>
</div>

<script>
    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;

    // UUID'лер (ESP32нин ички кодунда ушул эле UUID болушу керек)
    const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    // Баракча ачылганда мурунку сакталган атты жүктөө
    window.onload = () => {
        let savedName = localStorage.getItem('esp32Name');
        if(savedName) document.getElementById('device-name').value = savedName;
    };

    function saveSettings() {
        let name = document.getElementById('device-name').value;
        localStorage.setItem('esp32Name', name);
        alert("Колонканын аты сакталды: " + name);
    }

    function updateStatus(text, className) {
        const statusBox = document.getElementById('status-box');
        statusBox.innerText = "Статус: " + text;
        statusBox.className = "status-box " + className;
    }

    async function connectBluetooth() {
        if (!navigator.bluetooth) {
            alert("Кечиресиз, сиздин браузер Bluetooth'ду колдобойт. Android телефонундагы Chrome колдонуп көрүңүз.");
            return;
        }

        let targetName = document.getElementById('device-name').value;

        try {
            updateStatus("Туташып жатат...", "");
            
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: targetName }],
                optionalServices: [SERVICE_UUID]
            });

            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            updateStatus("Ийгиликтүү туташты! (" + targetName + ")", "status-connected");
            
            document.getElementById('btn-connect').style.display = 'none';
            document.getElementById('btn-disconnect').style.display = 'block';
            document.getElementById('btn-pay').disabled = false;

        } catch (error) {
            console.error(error);
            updateStatus("Ката: Туташуу мүмкүн болбоду.", "status-error");
        }
    }

    function onDisconnected() {
        updateStatus("Байланыш үзүлдү", "status-error");
        resetButtons();
    }

    function disconnectBluetooth() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    }

    function resetButtons() {
        document.getElementById('btn-connect').style.display = 'block';
        document.getElementById('btn-disconnect').style.display = 'none';
        document.getElementById('btn-pay').disabled = true;
        bluetoothCharacteristic = null;
    }

    async function sendPaymentSignal() {
        if (!bluetoothCharacteristic) return;

        try {
            // Колонкага "TOLONDU" деген текстти жөнөтөбүз
            const encoder = new TextEncoder();
            const data = encoder.encode('TOLONDU');
            
            await bluetoothCharacteristic.writeValue(data);
            
            // Экрандагы статусту жаңыртабыз
            updateStatus("Сигнал жөнөтүлдү! Үн чыгат.", "status-connected");
            
            // 3 секунддан кийин кайра баштапкы абалга келтиребиз
            setTimeout(() => {
                updateStatus("Ийгиликтүү туташты!", "status-connected");
            }, 3000);

        } catch (error) {
            console.error(error);
            alert("Сигнал жөнөтүүдө ката кетти.");
        }
    }
</script>

</body>
</html>
